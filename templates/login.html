<!DOCTYPE html>
<html lang="{{ current_lang or 'ru' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t('login.title') }} — {{ dept }}</title>
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon_32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon_16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon_64.png') }}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>
<body class="login-page">

<div class="login-wrapper">
  <div class="login-header">
    <div class="login-badge">КАФ / ИИ</div>
    <div class="login-title">{{ t('login.title') }}</div>
    <div class="login-subtitle">{{ dept }}</div>
    <p class="login-about" style="font-size:12px;color:var(--clr-muted);margin-top:12px;line-height:1.5">
      {{ project_theme }}
    </p>
    <!-- Переключатель языка -->
    <div class="lang-switcher" style="padding:8px 0 0;justify-content:center;gap:8px">
      {% for code, name in languages.items() %}
      <a href="{{ url_for('set_language', lang=code) }}"
         class="lang-btn {% if current_lang == code %}active{% endif %}"
         style="flex:0 0 auto;min-width:48px">{{ code|upper }}</a>
      {% endfor %}
    </div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} mb-3">
          <i class="bi bi-{% if cat == 'danger' %}exclamation-triangle{% elif cat == 'success' %}check-circle{% else %}info-circle{% endif %} me-2"></i>
          {{ msg }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="login-card">
    <form method="post" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">{{ t('login.username') }}</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control"
                 placeholder="{{ t('login.username') }}" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">{{ t('login.password') }}</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" id="login-pwd" class="form-control"
                 placeholder="{{ t('login.password') }}" required>
          <button type="button" class="input-group-text" id="login-eye-btn"
                  style="cursor:pointer">
            <i class="bi bi-eye" id="login-eye"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="remember" id="remember">
          <label class="form-check-label" for="remember">{{ t('login.remember') }}</label>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>{{ t('login.submit') }}
      </button>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
